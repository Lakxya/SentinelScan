[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelscan"
version = "1.3.0"
description = "Local-first DevSecOps and cloud security assessment CLI"

readme = "README.md"
authors = [
    { name = "SentinelScan Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "cli", "devsecops", "sast", "sca", "dast", "cloud-security", "iac", "container-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
    "python-hcl2>=4.3.0",
    "packaging>=23.0",
    "semver>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
sentinelscan = "sentinelscan.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
